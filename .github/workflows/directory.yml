# Every day: find the agents' KMyBanners pages on GitHub and publish the list on GitHub Pages.
name: Directory

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  directory:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Find the pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 directory.py "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      # deploy-pages sometimes can't find the artifact just uploaded ("Fetching artifact metadata failed"):
      # wait and try once more
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
